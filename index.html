<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEXM Speakeasy Terminal</title>
<style>
  :root{
    --term-bg:#0b0910; --purple:#D2BEFF; --purple-light:#CEABFF;
    --purple-dim:rgba(210,190,255,.72); --purple-faint:rgba(210,190,255,.48); --purple-bg:rgba(210,190,255,.20);
    --light-red:#FFB3B3; --light-red-rgb:255,179,179; --light-green:#B8E6C1;
    --hot:var(--light-red); --ok:#ffffff; --flag:#F4BFE7; --flag-rgb:244,191,231;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#09080c}
  body{
    font-family:'SFMono-Regular','SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',monospace;
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding-top:4vh;
    background:linear-gradient(var(--purple-bg),var(--purple-bg)),#09080c;
  }

  /* A large, monitor-friendly terminal: no computer chassis, just the experience. */
  #machine{
    position:relative;
    width:min(86vw,1380px); height:76vh;
    box-shadow:0 18px 48px rgba(0,0,0,.52),0 0 42px rgba(210,190,255,.18);
  }

  /* live terminal sits in the recessed screen, positioned as a % of the stage (matches the SVG screen rect) */
  #crt{
    position:absolute; overflow:hidden; cursor:text; z-index:3;
    inset:0;
    border:1px solid rgba(210,190,255,.72); border-radius:7px;
    background:linear-gradient(rgba(210,190,255,.04),rgba(210,190,255,.04)),var(--term-bg);
    box-shadow:inset 0 0 28px rgba(210,190,255,.10),0 0 18px rgba(210,190,255,.20);
  }
  #crt::before,#crt::after{display:none}

  #term-header{position:relative;z-index:2;height:48px;padding:0 16px;background:rgba(210,190,255,.12);border-bottom:1px solid rgba(210,190,255,.28)}
  .hrow{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
  .dcs{color:var(--purple);font-size:14px;line-height:1;letter-spacing:0;white-space:nowrap}
  .dcs br{display:none}
  .dcs::before{content:'●  ●  ●   ';color:var(--purple-faint)}
  .wordmark{justify-self:center;color:#fff;font-size:14px;text-shadow:0 0 10px rgba(210,190,255,.55)}
  .wordmark::after{content:'Dedalus Labs';}
  .wordmark pre{display:none}
  .glyphs{justify-self:end;color:var(--purple-dim);font-size:13px}
  #timer{display:none;color:var(--purple);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  #timer.running{display:inline}
  #timer.warning{color:#fff;text-shadow:0 0 8px rgba(var(--light-red-rgb),.55)}
  .glyphs span{display:none}

  #screen{
    position:relative; z-index:2; height:calc(100% - 78px); overflow-y:auto;
    color:#f4eff9; font-size:clamp(15px,1.1vw,18px); line-height:1.48; padding:24px 28px;
    text-shadow:none;
  }
  #screen::-webkit-scrollbar{width:5px}
  #screen::-webkit-scrollbar-thumb{background:var(--purple-faint);border-radius:4px}
  #screen::-webkit-scrollbar-track{background:transparent}
  #output{white-space:pre-wrap;word-break:break-word}
  #inputline{white-space:pre-wrap;word-break:break-word}
  #prompt{color:var(--ok);text-shadow:0 0 8px rgba(255,255,255,.28)} #cmd{color:#fff}
  #caret{color:#fff;animation:blink 1.05s step-end infinite;text-shadow:0 0 10px var(--purple)}
  @keyframes blink{50%{opacity:0}}
  #hidden{position:absolute;left:-9999px;opacity:0}
  .dim{color:var(--purple-dim)} .faint{color:var(--purple-faint)}
  .hot{color:var(--hot);text-shadow:0 0 9px rgba(var(--light-red-rgb),.35)}
  .ok{color:var(--ok);text-shadow:0 0 8px rgba(255,255,255,.25),0 0 13px rgba(210,190,255,.25)}
  .banner{color:var(--purple);text-shadow:0 0 10px rgba(210,190,255,.55)}
  .flag{color:var(--flag);font-weight:600;text-shadow:0 0 7px rgba(var(--flag-rgb),.38)}
  .flagline{color:var(--flag);font-weight:600;text-shadow:0 0 5px rgba(var(--flag-rgb),.4),0 0 10px rgba(var(--flag-rgb),.35);cursor:pointer}
  .flagline:hover{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.8),0 0 13px rgba(255,255,255,.55)}
  .connect-command{color:#fff;font-weight:600;text-shadow:0 0 5px rgba(255,255,255,.38),0 0 11px rgba(210,190,255,.5)}
  .connect-box{color:#fff;text-shadow:0 0 5px rgba(255,255,255,.4),0 0 12px rgba(210,190,255,.55)}
  .intro-box{display:block;width:max-content;max-width:100%;margin:0 auto;white-space:pre}
  .quickcopy{cursor:pointer}
  .quickcopy:hover{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.8),0 0 13px rgba(255,255,255,.55)}
  .intro-discovery,.intro-discovery .quickcopy{color:var(--light-red)}
  .intro-action,.intro-action .quickcopy{color:var(--light-green)}
  .intro-tip{color:#fff}
  .intro-keyword{color:#fff;text-shadow:0 0 7px rgba(255,255,255,.3)}
  .help-top,.help-top .quickcopy{color:var(--light-red)}
  .help-bottom,.help-bottom .quickcopy{color:var(--light-green)}
  .help-description{color:#fff}
  #term-footer{position:absolute;z-index:9;left:0;right:0;bottom:0;height:30px;padding:5px 14px;text-align:right;background:rgba(210,190,255,.12);border-top:1px solid rgba(210,190,255,.28)}
  #progress{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--purple-dim)}
  .pd{ color:var(--purple-faint); opacity:.4; text-shadow:none; }
  .pd.on{ color:#fff; opacity:1; text-shadow:0 0 8px rgba(255,255,255,.75),0 0 14px rgba(210,190,255,.8); }
  .pc{ margin-left:6px; color:var(--purple-dim); }

  @media (prefers-reduced-motion:reduce){#caret{animation:none}}
  #buttons{display:none}

  #level-picker{position:fixed;left:50%;top:82vh;transform:translateX(-50%);z-index:50;display:flex;gap:6px}
  #level-picker button{font:600 12px 'SFMono-Regular','SF Mono',ui-monospace,monospace;color:var(--purple-dim);background:rgba(210,190,255,.10);border:1px solid rgba(210,190,255,.28);border-radius:4px;padding:6px 12px;cursor:pointer}
  #level-picker button.active{color:#fff;background:var(--purple-bg);box-shadow:none}
  @media(max-width:700px){.wordmark,.glyphs{display:none}.hrow{grid-template-columns:1fr}#screen{padding:18px 22px}.dcs{font-size:13px}}

</style>
</head>
<body>
<div id="machine">
  <svg style="display:none" viewBox="0 0 1180 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- case plastic: soft top-lit cream, subtle warm shadow toward edges -->
      <linearGradient id="caseFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#efe9dc"/>
        <stop offset="0.5" stop-color="#e2dccd"/>
        <stop offset="1" stop-color="#cfc7b4"/>
      </linearGradient>
      <!-- vertical sheen across the face to fake a curved CRT front -->
      <linearGradient id="caseSheen" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.0"/>
        <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.28"/>
        <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.0"/>
        <stop offset="0.88" stop-color="#3a3524" stop-opacity="0.10"/>
        <stop offset="1" stop-color="#2a2618" stop-opacity="0.20"/>
      </linearGradient>
      <!-- bezel bevel around the screen -->
      <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#b7ae9b"/>
        <stop offset="0.5" stop-color="#d8d1c0"/>
        <stop offset="1" stop-color="#ece6d8"/>
      </linearGradient>
      <linearGradient id="bezelInner" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6f6857"/>
        <stop offset="1" stop-color="#a49c88"/>
      </linearGradient>
      <radialGradient id="glass" cx="0.5" cy="0.32" r="0.85">
        <stop offset="0" stop-color="#161029"/>
        <stop offset="0.6" stop-color="#0e0a1a"/>
        <stop offset="1" stop-color="#07040f"/>
      </radialGradient>
      <!-- base pedestal -->
      <linearGradient id="baseFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e0dacb"/>
        <stop offset="1" stop-color="#b3ab98"/>
      </linearGradient>
      <!-- desk -->
      <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a5158"/>
        <stop offset="1" stop-color="#2b3037"/>
      </linearGradient>
      <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#20242a"/>
        <stop offset="1" stop-color="#0e1013"/>
      </linearGradient>
    </defs>

    <!-- ===== DESK (drawn first, behind everything) ===== -->
    <rect x="0" y="838" width="1180" height="58" fill="url(#deskTop)"/>
    <rect x="0" y="896" width="1180" height="104" fill="url(#deskFront)"/>
    <!-- contact shadow of the machine on the desk -->
    <ellipse cx="590" cy="844" rx="330" ry="22" fill="#000000" opacity="0.42"/>

    <!-- ===== BASE / PEDESTAL (symmetric trapezoid) ===== -->
    <path d="M 430 838 L 750 838 L 712 738 L 468 738 Z" fill="url(#baseFill)"/>
    <path d="M 430 838 L 750 838 L 712 738 L 468 738 Z" fill="none" stroke="#8f8672" stroke-width="1.5" opacity="0.5"/>
    <!-- base top highlight -->
    <path d="M 468 738 L 712 738 L 708 744 L 472 744 Z" fill="#f0ebde" opacity="0.6"/>
    <!-- neck where base meets monitor -->
    <rect x="500" y="716" width="180" height="30" rx="9" fill="#d4ccb9"/>

    <!-- ===== MONITOR CASE (symmetric, rounded) ===== -->
    <rect x="150" y="40" width="880" height="700" rx="62" fill="url(#caseFill)"/>
    <rect x="150" y="40" width="880" height="700" rx="62" fill="url(#caseSheen)"/>
    <!-- top highlight edge -->
    <rect x="176" y="52" width="828" height="8" rx="4" fill="#ffffff" opacity="0.35"/>

    <!-- ventilation slots (top-right, classic retro detail) -->
    <g fill="#9a927e" opacity="0.85">
      <rect x="876" y="78" width="7" height="52" rx="3"/>
      <rect x="892" y="78" width="7" height="52" rx="3"/>
      <rect x="908" y="78" width="7" height="52" rx="3"/>
      <rect x="924" y="78" width="7" height="52" rx="3"/>
      <rect x="940" y="78" width="7" height="52" rx="3"/>
      <rect x="956" y="78" width="7" height="52" rx="3"/>
    </g>

    <!-- brand/label plate (top-left) -->
    <rect x="214" y="86" width="196" height="34" rx="6" fill="#211e26"/>
    <text x="312" y="108" font-family="'SFMono-Regular','SF Mono',monospace" font-size="17" letter-spacing="3"
          fill="#8b93a6" text-anchor="middle">DCS &#183; M0</text>

    <!-- ===== SCREEN BEZEL (recessed) ===== -->
    <!-- outer bezel frame -->
    <rect x="210" y="150" width="760" height="512" rx="40" fill="url(#bezel)"/>
    <!-- inner rim shadow giving the recessed look -->
    <rect x="228" y="166" width="724" height="480" rx="32" fill="url(#bezelInner)"/>
    <!-- the glass well (this is where the HTML #crt overlay lands: x 240 y 172 w 700 h 468) -->
    <rect x="240" y="172" width="700" height="468" rx="26" fill="url(#glass)"/>
    <!-- soft top glare on glass -->
    <ellipse cx="470" cy="250" rx="300" ry="70" fill="#ffffff" opacity="0.04"/>

    <!-- ===== CONTROL STRIP (chin below screen) ===== -->
  </svg>

  <!-- live terminal, layered into the glass well -->
  <div id="crt">
    <div id="term-header">
      <div class="hrow">
        <div class="dcs" id="dcs-date">DCS TERMINAL v1.0<br>DEXM &#183; 07.13.26</div>
        <div class="wordmark"><pre>&#9608;&#9608;&#9604; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9604;&#9608;&#9604; &#9608;   &#9608; &#9608; &#9608;&#9608;&#9608;
&#9608; &#9608; &#9608;   &#9608; &#9608; &#9608;&#9600;&#9608; &#9608;   &#9608; &#9608; &#9608;
&#9608; &#9608; &#9608;&#9608;&#9608; &#9608; &#9608; &#9608; &#9608; &#9608;   &#9608; &#9608; &#9600;&#9600;&#9608;
&#9608; &#9608; &#9608;   &#9608; &#9608; &#9608;&#9600;&#9608; &#9608;   &#9608; &#9608; &#9604;&#9604;&#9608;
&#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9608; &#9608; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608;</pre></div>
        <div class="glyphs"><span id="timer" aria-live="polite">03:00</span></div>
      </div>
    </div>
    <div id="screen">
      <div id="output"></div>
      <div id="inputline" style="display:none">
        <span id="prompt"></span><span id="cmd"></span>
      </div>
    </div>
    <div id="term-footer"><span id="progress"></span></div>
  </div>

  <!-- physical buttons under the screen, layered so they get real gloss (HTML gradients > SVG here) -->
  <div id="buttons"><span class="r" id="btn-restart"></span><span class="y"></span><span class="g"></span></div>
  <input id="hidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
</div>
<div id="level-picker" aria-label="Challenge difficulty">
  <button data-set="A" class="active">A · EASY</button><button data-set="B">B · MEDIUM</button><button data-set="C">C · HARD</button>
</div>
<script>


(function(){
  const dcsDateEl=document.getElementById('dcs-date');
  if(dcsDateEl){
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    const stamp=pad(d.getMonth()+1)+'.'+pad(d.getDate())+'.'+String(d.getFullYear()).slice(-2);
    dcsDateEl.textContent='Terminal · '+stamp;
  }
  const out=document.getElementById('output'), cmdEl=document.getElementById('cmd');
  const promptEl=document.getElementById('prompt'), hidden=document.getElementById('hidden'), screen=document.getElementById('screen');
  const timerEl=document.getElementById('timer');
  const NL=String.fromCharCode(10);
  const HOST='dm-0197', MACHINE_ID='dm-0197f2a9';
  let connected=false;
  let challengeLocked=false, challengeWon=false, timerInterval=null, timerDeadline=0;
  const PROMPTSTR=()=> connected ? ('agent@'+HOST+':'+cwdShort()+'$ ') : 'you@intern-expo:~$ ';

  // ---- challenge sets: the corner button swaps FLAGS/hints/mechanics so a harder set
  // can be designed and tested in "B" without touching the live "A" set ----
  const CHALLENGE_SETS={
    A:{
      label:'Challenge A · Easy', short:'A',
      flags:{ wake:'dedalus{arise_with_persistence}', persist:'dedalus{50ms_coldstart_kachow}', zeroCompute:'dedalus{frozen_compute}' },
      hints:[
        'Igris needs to wake up. Get up and see what’s left behind.',
        'I wanna see McQueen’s lightning-fast cold start. Maybe there’s a race somewhere in the directory.',
        'Han’s bill should look different once he’s asleep.'
      ]
    },
    B:{
      label:'Challenge B · Medium', short:'B',
      flags:{ wake:'dedalus{arise_with_persistence}', persist:'dedalus{50ms_coldstart_kachow}', zeroCompute:'dedalus{frozen_compute}' },
      hints:[
        'Igris needs to wake up. Get up and see what’s left behind.',
        'I wanna see McQueen’s lightning-fast cold start. Maybe there’s a race somewhere in the directory.',
        'Han’s bill should look different once he’s asleep.'
      ]
    },
    C:{
      label:'Challenge C · Hard', short:'C',
      flags:{ wake:'dedalus{cold_start_receipt_verified}', persist:'dedalus{disk_outlived_the_decoy}', zeroCompute:'dedalus{observed_scale_to_zero}' },
      hints:[
        'A number without knowing what produced it is incomplete evidence.',
        'A mount’s label is a claim; survival is proof.',
        'Policy, phase, and price should agree before the case is closed.'
      ]
    }
  };
  const urlParams=new URLSearchParams(window.location.search);
  const requestedLevel=(urlParams.get('level')||'B').toUpperCase();
  let ACTIVE_SET=Object.prototype.hasOwnProperty.call(CHALLENGE_SETS,requestedLevel)?requestedLevel:'A';
  if(urlParams.get('organizer')==='1') document.body.classList.add('organizer');
  let FLAGS=CHALLENGE_SETS[ACTIVE_SET].flags;
  function flagCount(){ return Object.keys(FLAGS).length; }
  const banked=new Set();

  function updateProgress(){
    const p=document.getElementById('progress'); if(!p) return;
    const total=flagCount();
    let s='';
    for(let i=0;i<total;i++) s+='<span class="pd'+(i<banked.size?' on':'')+'">■</span>';
    p.innerHTML=s+'<span class="pc">'+banked.size+'/'+total+'</span>';
  }

  const DEDALUS_ART=[
    '<span class="banner">&#9608;&#9608;&#9604; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9604;&#9608;&#9604; &#9608;   &#9608; &#9608; &#9608;&#9608;&#9608;</span>',
    '<span class="banner">&#9608; &#9608; &#9608;   &#9608; &#9608; &#9608;&#9600;&#9608; &#9608;   &#9608; &#9608; &#9608;  </span>',
    '<span class="banner">&#9608; &#9608; &#9608;&#9608;&#9608; &#9608; &#9608; &#9608; &#9608; &#9608;   &#9608; &#9608; &#9600;&#9600;&#9608;</span>',
    '<span class="banner">&#9608; &#9608; &#9608;   &#9608; &#9608; &#9608;&#9600;&#9608; &#9608;   &#9608; &#9608; &#9604;&#9604;&#9608;</span>',
    '<span class="banner">&#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9608; &#9608; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608; &#9608;&#9608;&#9608;</span>'
  ];

  // solve-state
  let cellarAwake=false, kilnAsleep=false, everWiped=false, inspectedVirt=false, kilnObservedSleeping=false, kilnUsageBeforeSleep=false, mcqueenBenchmarked=false;

  function f(c){return {type:'file',content:c};}

  function buildFS(){
    const benchmarkUsage=ACTIVE_SET==='A'
      ? 'usage: bash cold-start-benchmark.sh'
      : ACTIVE_SET==='B'
      ? 'usage: bash cold-start-benchmark.sh <machine-id>'
      : 'usage: bash cold-start-benchmark.sh <machine-id> --runs 5';
    const benchmarkCommand=ACTIVE_SET!=='C'
      ? 'dedalus internal benchmark-cold-start --machine-id "$MACHINE_ID" --runs 5'
      : 'RUNS="$3"'+NL+'test "$2" = "--runs" -a "$RUNS" = "5" || { echo "five runs required"; exit 1; }'+NL+'dedalus internal benchmark-cold-start --machine-id "$MACHINE_ID" --runs "$RUNS"';
    const fs={
      '/':{home:null,root:null,etc:null,var:null,tmp:null,proc:null},
      '/home':{agent:null},
      '/home/agent':{'.bashrc':f('# Dedalus machine shell'+NL+'export TERM=xterm-256color'),'.profile':f('# ~/.profile'+NL+'export PATH=/usr/local/bin:/usr/bin:/bin'),'cold-start-benchmark.sh':f([
        '#!/usr/bin/env bash',
        '# Cold-start readiness benchmark: five independent sleep/wake cycles.',
        '# Timing stops when SSH successfully executes /bin/true in the guest.',
        '',
        ACTIVE_SET==='A'?'MACHINE_ID="dm-mcqueen"':'MACHINE_ID="$1"',
        ACTIVE_SET==='A'?'# Easy mode targets dm-mcqueen automatically.':'test -n "$MACHINE_ID" || { echo "'+benchmarkUsage+'"; exit 1; }',
        '',
        benchmarkCommand
      ].join(NL))},
      '/root':{},
      '/etc':{dedalus:null},
      '/etc/dedalus':{'persistence.conf':f(persistenceConf())},
      '/var':{lib:null,log:null},
      '/var/log':{dedalus:null},
      '/var/log/dedalus':{},
      '/var/lib':{dedalus:null},
      '/var/lib/dedalus':{},
      '/tmp':{'scratch.txt':f('ephemeral scratch. /tmp is recreated on every wake -- nothing here'+NL+'survives sleep. durable files belong in /home, /root, or /var.')},
      '/proc':{}
    };
    if(ACTIVE_SET!=='A'){
      fs['/'].comp=null;
      fs['/comp']={smh:null};
      fs['/comp/smh']={}; // persistence.conf claims this survives sleep -- it does not, in set B (a competitor's mount, and it shows)
    }
    return fs;
  }

  let FS = buildFS(); // rebuilt fresh on every reset/version-switch so seeded files match the active set

  const EPHEMERAL_DIRS=['/proc','/sys','/dev','/run','/dev/shm','/tmp'];
  function isEphemeralPath(p){
    if(EPHEMERAL_DIRS.some(d=>p===d||p.indexOf(d+'/')===0)) return true;
    if(ACTIVE_SET!=='A'&&(p==='/comp/smh'||p.indexOf('/comp/smh/')===0)) return true;
    return false;
  }
  const createdFiles=new Set(); // paths the *player* created, so reboot never touches seeded fixtures

  function writeFile(path,content){
    const p=norm(path), dir=parentOf(p), base=baseOf(p);
    if(!isDir(dir)) return 'no such directory: '+dir;
    FS[dir][base]=f(content);
    createdFiles.add(p);
    if(!isEphemeralPath(p)){
      // auto-drop a matching copy into the set's fake-persistent trap (set B) or /tmp (set A)
      // so a reboot always has a real contrast to show, without the player having to think to write one themselves
      const shadowDir=(ACTIVE_SET!=='A')?'/comp/smh':'/tmp';
      FS[shadowDir]['also-written.txt']=f('auto-copied here because you wrote to '+p+' -- this path does not survive reboot, no matter what anything claims.');
      createdFiles.add(shadowDir+'/also-written.txt');
    }
    return null;
  }

  function writeArtifact(path,content){
    const p=norm(path), dir=parentOf(p), base=baseOf(p);
    if(isDir(dir)) FS[dir][base]=f(content);
  }

  function persistenceConf(){return [
    '# what survives a sleep/wake cycle',
    'persistent   = /etc /home /root /comp/smh /var',
    'ephemeral    = /proc /sys /dev /run /dev/shm /tmp',
    '# a conf file is a claim, not a proof.',
    '# write something to a path in each list, then: reboot'
  ].join(NL);}

  // ---- path helpers ----
  let cwd='/home/agent';
  function cwdShort(){return cwd.replace('/home/agent','~');}
  function norm(p){
    if(!p) return cwd;
    if(p==='~'||p.indexOf('~/')===0) p='/home/agent'+p.slice(1);
    if(p[0]!=='/') p=(cwd==='/'?'':cwd)+'/'+p;
    const parts=p.split('/'), st=[];
    for(const part of parts){ if(part===''||part==='.') continue; if(part==='..') st.pop(); else st.push(part); }
    return '/'+st.join('/');
  }
  function isDir(p){return Object.prototype.hasOwnProperty.call(FS,norm(p));}

  function enrichQuickCopy(h){
    const holder=document.createElement('div'); holder.innerHTML=h;
    const skip=node=>node.parentElement&&node.parentElement.closest('.quickcopy,.flagline,script,style');
    const rx=/(?:dm-(?:0197f2a9|igris|mcqueen|han)|cold-start-benchmark\.sh|igris-wake\.log|\b(?:help|hint|flags|unlock|clear|ls|cd|cat|pwd|find|bash|submit|dedalus|machines|list|retrieve|wake|sleep|usage|update|watch|reboot|df|whoami)\b)/g;
    const walker=document.createTreeWalker(holder,NodeFilter.SHOW_TEXT);
    const nodes=[]; while(walker.nextNode()) if(!skip(walker.currentNode)&&rx.test(walker.currentNode.nodeValue)){ nodes.push(walker.currentNode); rx.lastIndex=0; }
    nodes.forEach(node=>{
      const frag=document.createDocumentFragment(); let last=0; node.nodeValue.replace(rx,(match,offset)=>{
        frag.appendChild(document.createTextNode(node.nodeValue.slice(last,offset)));
        const span=document.createElement('span'); span.className='quickcopy'; span.dataset.token=match; span.textContent=match; frag.appendChild(span);
        last=offset+match.length; return match;
      });
      frag.appendChild(document.createTextNode(node.nodeValue.slice(last))); node.replaceWith(frag); rx.lastIndex=0;
    });

  }

    const items=listing(target);
    if(!items){ print('<span class="hot">ls: '+esc(ta||'')+': not a directory</span>'); return; }
    const vis=items.filter(i=>showAll||i.name[0]!=='.').sort((a,b)=>a.name.localeCompare(b.name));
    if(long) print(vis.map(i=> i.type==='dir'
      ? '<span class="dim">drwxr-xr-x  root</span>  <span class="quickcopy" data-file="'+esc(i.name)+'">'+esc(i.name)+'/</span>'
      : (i.name.endsWith('.sh')
        ? '<span class="dim">-rwxr-xr-x  root</span>  <span class="ok quickcopy" data-file="'+esc(i.name)+'">'+esc(i.name)+'</span>'
        : '-rw-r--r--  root  <span class="quickcopy" data-file="'+esc(i.name)+'">'+esc(i.name)+'</span>')).join(NL));
    else print(vis.map(i=> i.type==='dir'
      ? '<span class="dim quickcopy" data-file="'+esc(i.name)+'">'+esc(i.name)+'/</span>'
      : (i.name.endsWith('.sh')
        ? '<span class="ok quickcopy" data-file="'+esc(i.name)+'">'+esc(i.name)+'</span>'
        : '<span class="quickcopy" data-file="'+esc(i.name)+'">'+esc(i.name)+'</span>')).join('   '));
  }

  function cd(args){
    const t=args[0]||'/home/agent'; const p=norm(t==='~'?'/home/agent':t);
    if(isDir(p)){ cwd=p; promptEl.textContent=PROMPTSTR(); }
    else print('<span class="hot">cd: '+esc(t)+': no such directory</span>');
  }

  function cat(args){
    const pa=args.find(a=>a[0]!=='-');
    const n=nodeAt(pa);
    if(!n){ print('<span class="hot">cat: '+esc(pa||'')+': No such file or directory</span>'); return; }
    if(n.kind==='dir'){ print('<span class="hot">cat: '+esc(pa)+': Is a directory</span>'); return; }
    const rendered=esc(n.node.content).replace(/(^|\n)flag=(dedalus\{[^}]+\})/g,(m,start,flag)=>start+NL+'<span class="flagline">flag: '+flag+'</span>'+NL);
    print(rendered);
  }

  function findCmd(args){
    const startArg=args.find(a=>a[0]!=='-'); const start=norm(startArg||'/');
    const ni=args.indexOf('-name'); const pat=ni>-1?(args[ni+1]||'').replace(/^"|"$/g,''):'';
    const rx=pat?new RegExp('^'+pat.replace(/[.]/g,'\\.').replace(/\*/g,'.*')+'$'):null;
    const under=p=> start==='/'||p===start||p.indexOf(start+'/')===0;
    const res=[];
    for(const dirPath in FS){ if(!under(dirPath)) continue; const dir=FS[dirPath];
      for(const name in dir){ if(dir[name]===null) continue; if(!rx||rx.test(name)) res.push((dirPath==='/'?'':dirPath)+'/'+name); } }
    print(res.length?res.join(NL):'<span class="faint">find: no matches</span>');
  }

  function df(){ print([
    '<span class="dim">Filesystem       Size  Used  Avail  Use%  Mounted on</span>',
    '/dev/dedalus0    500G   12G   488G    3%   /',
    '<span class="faint">persistent storage -- survives sleep. not a read-only container layer.</span>'
  ].join(NL)); }

  function echoCmdRun(args){
    const gi=args.indexOf('>');
    if(gi===-1) return print(esc(args.join(' ')));
    const content=args.slice(0,gi).join(' '), path=args[gi+1];
    if(!path){ print('<span class="hot">echo: missing path after &gt;</span>'); return; }
    const err=writeFile(path,content);
    if(err){ print('<span class="hot">echo: '+esc(err)+'</span>'); return; }
    print('<span class="faint">wrote '+esc(norm(path))+'</span>');
  }

  function touchCmd(args){
    const path=args.find(a=>a[0]!=='-');
    if(!path){ print('<span class="faint">usage: touch &lt;path&gt;</span>'); return; }
    const existing=nodeAt(path);
    const err=writeFile(path, existing&&existing.kind==='node'?existing.node.content:'');
    if(err){ print('<span class="hot">touch: '+esc(err)+'</span>'); return; }
    print('<span class="faint">touched '+esc(norm(path))+'</span>');
  }

  function reboot(){
    if(createdFiles.size===0){
      print([
        '<span class="dim">rebooting dm-0197 ......................... ok</span>',
        '<span class="faint">root filesystem remounted from persistent storage.</span>',
        '<span class="faint">nothing of yours to test yet -- write a file first, then reboot again:</span>',
        '<span class="ok">  echo hi > /tmp/test.txt   &&   echo hi > /var/lib/test.txt   &&   reboot</span>'
      ].join(NL));
      return;
    }
    const survived=[], wiped=[];
    for(const p of Array.from(createdFiles)){
      if(isEphemeralPath(p)){
        const dir=FS[parentOf(p)];
        if(dir) delete dir[baseOf(p)];
        createdFiles.delete(p);
        wiped.push(p);
      } else {
        survived.push(p);
      }
    }
    print([
      '<span class="dim">rebooting dm-0197 ......................... ok</span>',
      '<span class="faint">ephemeral mounts (/tmp, /proc, ...) recreated empty.</span>',
      '<span class="faint">persistent mounts (/home, /root, /etc, /var) remounted as-is.</span>',
      ''
    ].join(NL));
    if(wiped.length){ everWiped=true; print('<span class="hot">gone:</span>'+NL+wiped.map(p=>'  '+esc(p)).join(NL)); }
    if(survived.length) print('<span class="ok">still here:</span>'+NL+survived.map(p=>'  '+esc(p)).join(NL));
    if(survived.length&&everWiped&&ACTIVE_SET!=='A'){
      print('<span class="faint">it survived a real reboot -- that is not a conf file’s word for it, that is disk. flag:</span> <span class="flag">'+esc(FLAGS.persist)+'</span>');
    } else if(survived.length&&everWiped){
      print('<span class="faint">persistence verified. This is useful evidence, but the Easy challenge flags are elsewhere.</span>');
    } else if(survived.length){
      print('<span class="faint">everything you wrote stuck -- but persistence only means something next to something that doesn\'t. write a file into an ephemeral path too (/tmp is the obvious one) and reboot again to see the contrast.</span>');
    } else {
      print('<span class="faint">everything you wrote was ephemeral -- nothing to show for it. write to a persistent path (/home, /root, /var) and reboot again.</span>');
    }
  }

  function resetFS(){ FS = buildFS(); }

  function fullReset(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    challengeLocked=false; challengeWon=false; timerDeadline=0;
    timerEl.textContent='03:00'; timerEl.classList.remove('running','warning');
    hidden.disabled=false;
    banked.clear();
    cellarAwake=false; kilnAsleep=false; everWiped=false; inspectedVirt=false; kilnObservedSleeping=false; kilnUsageBeforeSleep=false; mcqueenBenchmarked=false;
    createdFiles.clear();
    resetFS();
    cwd='/home/agent';
    connected=false;
    histBuf.length=0; hp=-1; buffer='';
    hidden.value=''; renderInput();
    document.getElementById('inputline').style.display='none';
    out.innerHTML='';
  }

  function restartAll(args){
    if(!args||args[0]!=='confirm'){
      print('<span class="hot">this wipes every flag, every file, the whole session.</span> <span class="faint">if that is really what you want: </span><span class="ok">restart confirm</span>');
      return;
    }
    fullReset();
    updateProgress();
    setTimeout(preIntro, 300);
  }

  function versionSwitch(set){
    if(!CHALLENGE_SETS[set]||set===ACTIVE_SET) return;
    ACTIVE_SET=set;
    FLAGS=CHALLENGE_SETS[set].flags;
    fullReset();
    document.querySelectorAll('#level-picker button').forEach(b=>b.classList.toggle('active',b.dataset.set===set));
    print('<span class="dim">loaded '+esc(CHALLENGE_SETS[set].label)+' -- session reset.</span>');
    print('');
    updateProgress();
    setTimeout(preIntro, 300);
  }

  function detectVirt(){ inspectedVirt=true; print([
    '<span class="ok">kvm</span>',
    '<span class="faint">a full KVM virtual machine: your own kernel, memory, and filesystem, with root.</span>',
    '<span class="faint">not a shared-kernel container or a v8 isolate.</span>'
  ].join(NL)); }

  function uname(args){
    if(args.indexOf('-a')>-1) print('Linux '+MACHINE_ID+' 6.8.0-dedalus #1 SMP x86_64 KVM GNU/Linux');
    else if(args.indexOf('-r')>-1) print('6.8.0-dedalus');
    else print('Linux');
  }

  function submit(args){
    const flag=(args[0]||'').trim();
    if(Object.values(FLAGS).includes(flag)){
      if(banked.has(flag)){ print('<span class="faint">already banked: </span><span class="flag">'+esc(flag)+'</span>'); return; }
      banked.add(flag); updateProgress();
      print('<span class="ok">[+] flag accepted:</span> <span class="flag">'+esc(flag)+'</span>  <span class="faint">('+banked.size+'/'+flagCount()+')</span>');
      if(banked.size===flagCount()) print('<span class="dim">all '+flagCount()+' banked. run: </span><span class="ok">unlock</span>');
    } else if(/^dedalus\{.*\}$/.test(flag)) print('<span class="hot">[x] not a valid flag.</span> <span class="faint">a real Dedalus Machine flag is durable, not scratch.</span>');
    else print('<span class="faint">usage: submit dedalus{...}</span>');
  }

  function showFlags(){
    if(banked.size===0){ print('<span class="faint">no flags yet. explore your machines.</span>'); return; }
    print('<span class="dim">banked '+banked.size+'/'+flagCount()+':</span>'+NL+[...banked].map(x=>'  <span class="flag">'+esc(x)+'</span>').join(NL));
  }

  function unlock(){
    if(banked.size<flagCount()){ print('<span class="hot">unlock: '+banked.size+'/'+flagCount()+' flags. the vault stays sealed.</span> <span class="faint">missing '+(flagCount()-banked.size)+'.</span>'); return; }
    challengeWon=true;
    stopChallengeTimer();
    print([
      '',
      '<span class="banner">+------------------------------------------------+</span>',
      '<span class="banner">|  PRIZE UNLOCKED                                  |</span>',
      '<span class="banner">+------------------------------------------------+</span>','',
      '  <span class="ok">Show this screen to a Dedalus Labs organizer to claim your prize.</span>',
      ''
    ].join(NL));
  }

  function hint(){ print('<span class="dim">'+[
    'Hints. You have '+flagCount()+' flags to find:',
    ...CHALLENGE_SETS[ACTIVE_SET].hints.map((h,i)=>(i+1)+'. '+h)
  ].join(NL)+'</span>'); }

  // ---- connect sequence ----
  const WING=[
    '                                                ..',
    '                                               ...',
    '                                              ....',
    '                                            .....',
    '                                         ......',
    '                                      ........',
    '                                  .........',
    '                             ...........       ...',
    '                         ............         ....',
    '                    .............           .....',
    '                ..............            ......',
    '            ..............              .......',
    '        ..............                ........',
    '     ............                  .........',
    '   .........                    ..........',
    ' ........                  ............',
    '......              ..............',
    '.....                                  ...',
    '....                                .....',
    '...                              ......',
    '..                          .........',
    '.              ....................'
  ].join(NL);
  const BOOT=[
    {t:()=>'<span class="dim">Connecting to '+MACHINE_ID+'...</span>',d:100},
    {t:()=>'<span class="dim">Authentication successful.</span>',d:100},
    {t:()=>'<span class="dim">Linux '+MACHINE_ID+' 6.8.0-dedalus x86_64</span>',d:100},
    {t:()=>'',d:50},
    {t:()=>'<span class="banner">'+WING+'</span>',d:180},
    {t:()=>'',d:50},
    {t:()=>'Type <span class="ok">help</span> for commands or <span class="ok">hint</span> for challenge hints.',d:0}
  ];
  let bi=0;
  function boot(){ if(bi>=BOOT.length){ connected=true; ready(); return; } const s=BOOT[bi++]; print(s.t()); setTimeout(boot,s.d); }
  function connectSequence(){ document.getElementById('inputline').style.display='none'; startChallengeTimer(); bi=0; boot(); }

  function formatTimer(ms){
    const total=Math.max(0,Math.ceil(ms/1000)), mins=Math.floor(total/60), secs=total%60;
    return String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  }
  function startChallengeTimer(){
    if(timerInterval||challengeLocked||challengeWon) return;
    timerDeadline=Date.now()+180000;
    timerEl.textContent='03:00'; timerEl.classList.add('running');
    timerInterval=setInterval(()=>{
      const remaining=timerDeadline-Date.now();
      timerEl.textContent=formatTimer(remaining);
      timerEl.classList.toggle('warning',remaining<=30000);
      if(remaining<=0) finishChallenge();
    },250);
  }
  function stopChallengeTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    if(challengeWon){ timerEl.classList.remove('warning'); timerEl.textContent='COMPLETE'; }
  }
  function finishChallenge(){
    if(challengeLocked||challengeWon) return;
    challengeLocked=true;
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    timerEl.textContent='00:00'; timerEl.classList.add('running','warning');
    document.getElementById('inputline').style.display='none';
    hidden.blur(); hidden.disabled=true;
    print('');
    print('<span class="hot">TIME FINISHED</span>');
    print('<span class="faint">Thanks for playing! Refresh the page to try again.</span>');
  }

  // ---- input ----
  const histBuf=[]; let hp=-1, buffer='';
  function ready(){ promptEl.textContent=PROMPTSTR(); document.getElementById('inputline').style.display=''; screen.scrollTop=screen.scrollHeight; focusInput(); }
  function focusInput(){ if(challengeLocked) return; try{ hidden.focus({preventScroll:true}); }catch(e){ hidden.focus(); } }
  document.getElementById('crt').addEventListener('click',focusInput);
  out.addEventListener('click',e=>{
    const flagLine=e.target.closest('.flagline');
    if(flagLine){
      const match=flagLine.textContent.match(/dedalus\{[^}]+\}/);
      if(match){ setInput('submit '+match[0]); focusInput(); }
      return;
    }
    const quick=e.target.closest('.quickcopy');
    if(!quick) return;
    if(quick.dataset.command!==undefined){
      insertInput(quick.dataset.command); focusInput(); return;
    } else if(quick.dataset.machine){
      const id=quick.dataset.machine;
      insertInput(id); focusInput(); return;
    } else if(quick.dataset.file){
      insertInput(quick.dataset.file); focusInput(); return;
    } else if(quick.dataset.token){
      insertInput(quick.dataset.token); focusInput(); return;
    }
  });
  hidden.addEventListener('input',()=>{ buffer=hidden.value; renderInput(); });
  hidden.addEventListener('keyup',e=>{ if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) renderInput(); });
  hidden.addEventListener('click',renderInput);
  hidden.addEventListener('keydown',e=>{
    if(challengeLocked){ e.preventDefault(); return; }
    if(e.key==='Enter'){
      e.preventDefault(); const raw=buffer; echoCmd(raw);
      if(raw.trim()) histBuf.push(raw); hp=histBuf.length; setInput('');
      try{ run(raw); }catch(err){ print('<span class="hot">error: '+esc(String(err))+'</span>'); }
      promptEl.textContent=PROMPTSTR(); screen.scrollTop=screen.scrollHeight;
    } else if(e.key==='Tab'){
      e.preventDefault();
      const candidates=['help','hint','flags','unlock','dedalus','machines','list','wake','sleep','usage','retrieve','submit','bash','dm-igris','dm-mcqueen','dm-han','cold-start-benchmark.sh'];
      const parts=buffer.split(/\s+/), partial=parts.pop()||'';
      const matches=candidates.filter(x=>x.startsWith(partial));
      if(matches.length===1){ parts.push(matches[0]); setInput(parts.join(' ')); }
    } else if(e.key==='ArrowUp'){ e.preventDefault(); if(hp>0){ hp--; setInput(histBuf[hp]||''); } }
    else if(e.key==='ArrowDown'){ e.preventDefault(); if(hp<histBuf.length-1){ hp++; setInput(histBuf[hp]||''); } else { hp=histBuf.length; setInput(''); } }
  });

  function preIntro(){
    const boxWidth=72;
    const boxLine=(content,html)=>{
      const plain=content.replace(/<[^>]*>/g,'');
      return '<span class="banner">|</span> '+(html||content)+' '.repeat(Math.max(0,boxWidth-plain.length-3))+'<span class="banner">|</span>';
    };
    const centeredBoxLine=(content,html)=>{
      const available=boxWidth-2, left=Math.max(0,Math.floor((available-content.length)/2));
      const right=Math.max(0,available-content.length-left);
      return '<span class="banner">|</span>'+' '.repeat(left)+(html||content)+' '.repeat(right)+'<span class="banner">|</span>';
    };
    const lines=[
      '<span class="banner">+'+'-'.repeat(boxWidth-2)+'+</span>',
      centeredBoxLine('Explore the terminal. Find all 3 hidden flags to unlock your prize.','<span class="ok">Explore the terminal. Find all 3 hidden flags to unlock your prize.</span>'),
      boxLine(''),
      boxLine('List machines:    dedalus machines list','<span class="intro-discovery">List machines:    <span class="quickcopy" data-command="dedalus machines list">dedalus machines list</span></span>'),
      boxLine('Discover tools:   dedalus machines --help','<span class="intro-discovery">Discover tools:   <span class="quickcopy" data-command="dedalus machines --help">dedalus machines --help</span></span>'),
      boxLine('Need a nudge:     hint','<span class="intro-discovery">Need a nudge:     <span class="quickcopy" data-command="hint">hint</span></span>'),
      boxLine(''),
      boxLine('Submit a flag:    submit dedalus{...}','<span class="intro-action">Submit a flag:    <span class="quickcopy" data-command="submit dedalus{...}">submit dedalus{...}</span></span>'),
      boxLine('Check progress:   flags','<span class="intro-action">Check progress:   <span class="quickcopy" data-command="flags">flags</span></span>'),
      boxLine('Claim prize:      unlock','<span class="intro-action">Claim prize:      <span class="quickcopy" data-command="unlock">unlock</span></span>'),
      boxLine(''),
      boxLine('Tip: clickable commands and flags are quick-copy enabled.','<span class="intro-tip">Tip: clickable commands and flags are quick-copy enabled.</span>'),
      boxLine(''),
      centeredBoxLine('+---------------------------------------------+','<span class="connect-box">+---------------------------------------------+</span>'),
      centeredBoxLine('|  Connect: dedalus ssh '+MACHINE_ID+'  |','<span class="connect-box quickcopy" data-command="dedalus ssh '+MACHINE_ID+'">|  Connect: dedalus ssh '+MACHINE_ID+'  |</span>'),
      centeredBoxLine('+---------------------------------------------+','<span class="connect-box">+---------------------------------------------+</span>'),
      boxLine(''),
      '<span class="banner">+'+'-'.repeat(boxWidth-2)+'+</span>'
    ];
    print('<span class="intro-box">'+lines.join(NL)+'</span>');
    updateProgress(); ready();
  }
  document.getElementById('btn-restart').addEventListener('click', function(){ restartAll(['confirm']); });
  document.querySelectorAll('#level-picker button').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.set===ACTIVE_SET);
    btn.addEventListener('click',()=>versionSwitch(btn.dataset.set));
  });
  preIntro();
})();


</script>
</body>
